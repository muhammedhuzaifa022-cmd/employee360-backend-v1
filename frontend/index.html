<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Employee360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f3f5fa;
            --bg2: #eaeef7;
            --card: #fff;
            --card2: #f8f9fd;
            --ink: #0f172a;
            --ink2: #334155;
            --mute: #6b7688;
            --line: #e4e9f2;
            --acc: #4f46e5;
            --acc-ink: #fff;
            --acc-soft: #eef0ff;
            --acc-line: #d9dbff;
            --ok: #0d9b74;
            --ok-soft: #e4f7f0;
            --warn: #c07a12;
            --warn-soft: #fdf2e0;
            --bad: #dc4b4b;
            --bad-soft: #fdeceb;
            --blue: #2f6fd0;
            --blue-soft: #e8f0fd;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
            --shadow: 0 6px 20px rgba(15, 23, 42, .07);
            --shadow-lg: 0 24px 60px rgba(15, 23, 42, .18);
            --r: 16px;
            --r-sm: 11px;
            --ease: cubic-bezier(.32, .72, .35, 1);
        }

        [data-theme="dark"] {
            --bg: #0b101b;
            --bg2: #0f1626;
            --card: #151c2b;
            --card2: #1a2233;
            --ink: #eaeef8;
            --ink2: #c3cbdb;
            --mute: #8b96ab;
            --line: #263045;
            --acc: #8b85ff;
            --acc-ink: #0b101b;
            --acc-soft: #232248;
            --acc-line: #33316b;
            --ok: #4dd2a4;
            --ok-soft: #123027;
            --warn: #f0bb62;
            --warn-soft: #33260f;
            --bad: #ff8484;
            --bad-soft: #35191b;
            --blue: #7cb0ff;
            --blue-soft: #14243d;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
            --shadow: 0 8px 26px rgba(0, 0, 0, .35);
            --shadow-lg: 0 28px 70px rgba(0, 0, 0, .55);
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 14.5px/1.55 "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background .25s var(--ease), color .25s var(--ease)
        }

        h1,
        h2,
        h3,
        h4,
        p {
            margin: 0
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        svg.ic {
            width: 18px;
            height: 18px;
            flex: none;
            display: block
        }

        ::selection {
            background: var(--acc);
            color: var(--acc-ink)
        }

        *::-webkit-scrollbar {
            width: 9px;
            height: 9px
        }

        *::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 99px;
            border: 2px solid transparent;
            background-clip: content-box
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--mute);
            background-clip: content-box
        }

        *::-webkit-scrollbar-track {
            background: transparent
        }

        .shell {
            display: flex;
            min-height: 100vh
        }

        .side {
            width: 252px;
            flex: none;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
            background: var(--card);
            border-right: 1px solid var(--line);
            padding: 20px 13px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: background .25s var(--ease), border-color .25s var(--ease)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 2px 8px 20px
        }

        .logo {
            width: 38px;
            height: 38px;
            flex: none;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(140deg, var(--acc), color-mix(in srgb, var(--acc) 55%, #ff7bd5));
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 6px 16px color-mix(in srgb, var(--acc) 38%, transparent)
        }

        .brand b {
            display: block;
            font-size: 15.5px;
            letter-spacing: -.4px;
            font-weight: 800;
            line-height: 1.2
        }

        .brand small {
            display: block;
            color: var(--mute);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .2px;
            margin-top: 2px
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9.5px 12px;
            border-radius: 11px;
            color: var(--mute);
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: background .16s var(--ease), color .16s var(--ease), transform .16s var(--ease);
            position: relative;
            user-select: none
        }

        .nav a:hover {
            background: var(--bg2);
            color: var(--ink)
        }

        .nav a:active {
            transform: scale(.985)
        }

        .nav a.on {
            background: var(--acc-soft);
            color: var(--acc);
            font-weight: 750
        }

        .nav a.on::before {
            content: '';
            position: absolute;
            left: -13px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            border-radius: 0 4px 4px 0;
            background: var(--acc)
        }

        .nav .badge {
            margin-left: auto;
            min-width: 19px;
            height: 19px;
            padding: 0 6px;
            border-radius: 99px;
            background: var(--bad);
            color: #fff;
            font-size: 10.5px;
            font-weight: 800;
            display: grid;
            place-items: center;
            line-height: 1
        }

        .side-foot {
            border-top: 1px solid var(--line);
            margin-top: 10px;
            padding-top: 9px;
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .side-btn {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9px 12px;
            border-radius: 11px;
            border: 0;
            background: transparent;
            color: var(--mute);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: .16s var(--ease)
        }

        .side-btn:hover {
            background: var(--bg2);
            color: var(--ink)
        }

        main {
            flex: 1;
            min-width: 0;
            padding: 26px clamp(16px, 2.6vw, 38px) 60px;
            max-width: 1560px;
            margin: 0 auto;
            width: 100%
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 22px
        }

        .top h1 {
            font-size: clamp(21px, 2.4vw, 27px);
            letter-spacing: -.9px;
            font-weight: 800;
            line-height: 1.2
        }

        .top .sub {
            color: var(--mute);
            font-size: 12.5px;
            margin-top: 4px;
            font-weight: 500
        }

        .who-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 5px 14px 5px 5px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: .16s var(--ease)
        }

        .who-chip:hover {
            border-color: var(--acc)
        }

        .who-chip b {
            display: block;
            font-size: 12.5px;
            font-weight: 750;
            line-height: 1.2
        }

        .who-chip span.role {
            display: block;
            font-size: 10.5px;
            color: var(--mute);
            font-weight: 600;
            text-transform: capitalize
        }

        .av {
            --h: 250;
            width: 32px;
            height: 32px;
            flex: none;
            border-radius: 50%;
            display: inline-grid;
            place-items: center;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: .2px;
            background: hsl(var(--h) 85% 93%);
            color: hsl(var(--h) 55% 34%);
            border: 1px solid hsl(var(--h) 70% 88%)
        }

        [data-theme="dark"] .av {
            background: hsl(var(--h) 38% 22%);
            color: hsl(var(--h) 78% 78%);
            border-color: hsl(var(--h) 32% 32%)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            transition: background .25s var(--ease), border-color .25s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease)
        }

        .card h3 {
            font-size: 14.5px;
            font-weight: 750;
            letter-spacing: -.2px;
            margin: 0 0 12px
        }

        .card h3.tight {
            margin-bottom: 2px
        }

        .card .hint {
            font-size: 12px;
            color: var(--mute);
            margin: -8px 0 14px;
            font-weight: 500
        }

        .grid {
            display: grid;
            gap: 14px
        }

        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))
        }

        .g3 {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr))
        }

        .g4 {
            grid-template-columns: repeat(auto-fit, minmax(158px, 1fr))
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .stat {
            position: relative;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            transition: transform .2s var(--ease), box-shadow .2s var(--ease)
        }

        .stat:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow)
        }

        .stat .k {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--mute);
            text-transform: uppercase;
            letter-spacing: .6px
        }

        .stat .v {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1.2px;
            line-height: 1.15;
            margin-top: 5px
        }

        .stat .ico {
            position: absolute;
            right: 14px;
            top: 14px;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: var(--acc-soft);
            color: var(--acc)
        }

        .stat.ok .ico {
            background: var(--ok-soft);
            color: var(--ok)
        }

        .stat.bad .ico {
            background: var(--bad-soft);
            color: var(--bad)
        }

        .stat.warn .ico {
            background: var(--warn-soft);
            color: var(--warn)
        }

        .stat.blue .ico {
            background: var(--blue-soft);
            color: var(--blue)
        }

        .stat.alert {
            border-color: color-mix(in srgb, var(--bad) 40%, var(--line))
        }

        .stat.alert .v {
            color: var(--bad)
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: var(--acc);
            color: var(--acc-ink);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 9px 15px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 3px 10px color-mix(in srgb, var(--acc) 24%, transparent);
            transition: transform .14s var(--ease), filter .14s var(--ease), box-shadow .14s var(--ease), background .16s var(--ease);
            white-space: nowrap
        }

        .btn:hover {
            filter: brightness(1.07);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px color-mix(in srgb, var(--acc) 30%, transparent)
        }

        .btn:active {
            transform: translateY(0) scale(.985)
        }

        .btn.ghost {
            background: var(--card);
            color: var(--ink2);
            border-color: var(--line);
            box-shadow: var(--shadow-sm)
        }

        .btn.ghost:hover {
            background: var(--bg2);
            color: var(--ink);
            border-color: color-mix(in srgb, var(--acc) 30%, var(--line))
        }

        .btn.ok {
            background: var(--ok);
            box-shadow: 0 3px 10px color-mix(in srgb, var(--ok) 24%, transparent)
        }

        .btn.bad {
            background: var(--bad);
            box-shadow: 0 3px 10px color-mix(in srgb, var(--bad) 24%, transparent)
        }

        .btn.sm {
            padding: 6px 11px;
            font-size: 12px;
            border-radius: 9px
        }

        .btn.xs {
            padding: 4px 9px;
            font-size: 11.5px;
            border-radius: 8px
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none !important
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--mute);
            margin: 14px 0 6px;
            letter-spacing: .1px
        }

        label:first-child {
            margin-top: 0
        }

        input,
        select,
        textarea {
            background: var(--card2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9.5px 12px;
            width: 100%;
            min-height: 41px;
            font-size: 13.5px;
            font-weight: 500;
            transition: border-color .16s var(--ease), box-shadow .16s var(--ease), background .2s var(--ease)
        }

        textarea {
            resize: vertical;
            min-height: 70px;
            line-height: 1.5
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 0;
            border-color: var(--acc);
            background: var(--card);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 16%, transparent)
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
            background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 32px
        }

        select[multiple] {
            background-image: none;
            padding-right: 12px
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .row>* {
            width: auto
        }

        .row.grow>* {
            flex: 1;
            min-width: 0
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3.5px 9px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .1px;
            white-space: nowrap;
            background: var(--bg2);
            color: var(--mute);
            border: 1px solid transparent
        }

        .tag.ok {
            background: var(--ok-soft);
            color: var(--ok)
        }

        .tag.bad {
            background: var(--bad-soft);
            color: var(--bad)
        }

        .tag.warn {
            background: var(--warn-soft);
            color: var(--warn)
        }

        .tag.blue {
            background: var(--blue-soft);
            color: var(--blue)
        }

        .tag.acc {
            background: var(--acc-soft);
            color: var(--acc)
        }

        .tag.mute {
            background: var(--bg2);
            color: var(--mute)
        }

        .tag.High {
            background: var(--bad-soft);
            color: var(--bad)
        }

        .tag.Medium {
            background: var(--warn-soft);
            color: var(--warn)
        }

        .tag.Low {
            background: var(--bg2);
            color: var(--mute)
        }

        .bar {
            height: 7px;
            background: var(--bg2);
            border-radius: 99px;
            overflow: hidden;
            min-width: 60px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--acc);
            border-radius: 99px;
            transition: width .7s var(--ease)
        }

        .bar.ok i {
            background: var(--ok)
        }

        .bar.warn i {
            background: var(--warn)
        }

        .bar.bad i {
            background: var(--bad)
        }

        .ring {
            width: 54px;
            height: 54px;
            flex: none;
            transform: rotate(-90deg)
        }

        .ring circle {
            fill: none;
            stroke-width: 3.6;
            stroke-linecap: round
        }

        .ring .bg {
            stroke: var(--line)
        }

        .ring .fg {
            stroke: var(--acc);
            transition: stroke-dasharray .9s var(--ease)
        }

        .tcard {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: border-color .16s var(--ease), box-shadow .16s var(--ease), transform .16s var(--ease), background .16s var(--ease)
        }

        .tcard:hover {
            border-color: color-mix(in srgb, var(--acc) 40%, var(--line));
            box-shadow: var(--shadow);
            transform: translateY(-1px)
        }

        .tcard:active {
            transform: translateY(0)
        }

        .tcard .lead {
            width: 4px;
            align-self: stretch;
            border-radius: 99px;
            background: var(--line);
            flex: none
        }

        .tcard.p-high .lead {
            background: var(--bad)
        }

        .tcard.p-medium .lead {
            background: var(--warn)
        }

        .tcard.p-low .lead {
            background: var(--line)
        }

        .tcard .body {
            flex: 1;
            min-width: 0
        }

        .tcard .title {
            font-weight: 700;
            font-size: 13.5px;
            letter-spacing: -.15px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .tcard .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            color: var(--mute);
            font-size: 11.5px;
            font-weight: 550;
            margin-top: 4px
        }

        .tcard .meta .sep {
            opacity: .4
        }

        .tcard .right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex: none
        }

        .due {
            font-size: 11.5px;
            font-weight: 750;
            color: var(--mute);
            white-space: nowrap
        }

        .due.over {
            color: var(--bad)
        }

        .due.today {
            color: var(--warn)
        }

        .mini {
            width: auto;
            min-height: 0;
            padding: 5px 26px 5px 9px;
            font-size: 11.5px;
            font-weight: 700;
            border-radius: 8px;
            background: var(--card2);
            background-position: calc(100% - 13px) 12px, calc(100% - 8px) 12px;
            background-size: 4px 4px, 4px 4px
        }

        .sechead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .sechead h2 {
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: -.4px;
            display: flex;
            align-items: center;
            gap: 9px
        }

        .sechead .count {
            font-size: 11px;
            font-weight: 800;
            background: var(--bad);
            color: #fff;
            border-radius: 99px;
            padding: 1px 8px;
            line-height: 1.7
        }

        .sechead .count.n {
            background: var(--bg2);
            color: var(--mute)
        }

        .chips {
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        .chip {
            padding: 7px 14px;
            border-radius: 99px;
            background: var(--card);
            border: 1px solid var(--line);
            font-size: 12.5px;
            font-weight: 700;
            color: var(--mute);
            cursor: pointer;
            transition: .16s var(--ease);
            white-space: nowrap
        }

        .chip:hover {
            border-color: color-mix(in srgb, var(--acc) 40%, var(--line));
            color: var(--ink)
        }

        .chip.on {
            background: var(--acc);
            border-color: var(--acc);
            color: var(--acc-ink);
            box-shadow: 0 3px 10px color-mix(in srgb, var(--acc) 26%, transparent)
        }

        .empty {
            text-align: center;
            padding: 34px 18px;
            color: var(--mute)
        }

        .empty .eic {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--bg2);
            color: var(--mute);
            display: grid;
            place-items: center;
            margin: 0 auto 12px
        }

        .empty b {
            display: block;
            color: var(--ink);
            font-size: 14px;
            margin-bottom: 4px
        }

        .empty p {
            font-size: 12.5px;
            margin: 0 0 14px
        }

        .calwrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 336px;
            gap: 16px;
            align-items: start
        }

        .calbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .calbar .mname {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: -.3px;
            min-width: 150px;
            text-align: center
        }

        .mg {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border: 1px solid var(--line);
            border-radius: 13px;
            overflow: hidden;
            background: var(--line)
        }

    <script>

function downloadReportsCSV() {
    // Fetch reports using the authentication token
    const token = localStorage.getItem('access_token');

    fetch('https://employee360-backend-v1.onrender.com/api/v1/reports/my-reports', {
        headers: {
            'Authorization': `Bearer ${token}`
        }
    })
    .then(res => res.json())
    .then(data => {

        if (!data || data.length === 0) {
            return alert("No reports to download.");
        }

        // 1. Create CSV Header
        let csvContent = "Date,Employee ID,Report Content\n";

        // 2. Add Rows
        data.forEach(r => {

            // Escape double quotes and commas in report content
            const cleanContent = `"${(r.content || '').replace(/"/g, '""')}"`;

            csvContent += `${r.report_date},${r.employee_id},${cleanContent}\n`;
        });

        // 3. Trigger Download
        const blob = new Blob([csvContent], {
            type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "daily_reports.csv");

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    })

        alert("Error downloading CSV");
    });
}

async function fetchRealData() {
    const token = localStorage.getItem('access_token');
    if (!token) return;

    const headers = {
        'Authorization': `Bearer ${token}`
    };

    try {
        // 1. Fetch Current User
        const meRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/auth/me', { headers });
        if (!meRes.ok) throw new Error("Session expired");

        const meData = await meRes.json();
        S.me = meData.id.toString();

        // 2. Fetch Users
        const usersRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/users?page_size=100', { headers });
        if (!usersRes.ok) throw new Error("Failed to fetch users");

        const usersData = await usersRes.json();

        S.users = usersData.items.map(u => ({
            id: u.id.toString(),
            name: u.full_name,
            email: u.email,
            role: u.role,
            dept: u.department ? u.department.name : 'Management',
            desig: u.designation || 'Associate',
            active: u.is_active,
            joined: u.joined_on
        }));

        // 3. Fetch Projects
        const projRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/projects', { headers });
        if (!projRes.ok) throw new Error("Failed to fetch projects");

        const projData = await projRes.json();

        S.projects = projData.items.map(p => ({
            id: p.id.toString(),
            name: p.name,
            desc: p.description || '',
            mgr: p.manager.id.toString(),
            members: p.members.map(m => m.id.toString()),
            start: p.start_date,
            end: p.end_date,
            prio: p.priority
        }));

        // 4. Fetch Tasks
        const tasksRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/tasks?page_size=100', { headers });
        if (!tasksRes.ok) throw new Error("Failed to fetch tasks");

        const tasksData = await tasksRes.json();

        S.tasks = tasksData.items.map(t => ({
            id: t.id.toString(),
            title: t.title,
            desc: t.description || '',
            emp: t.assignee.id.toString(),
            proj: t.project ? t.project.id.toString() : '',
            start: t.start_date,
            due: t.due_date,
            prio: t.priority,
            status: t.status,
            by: t.assigned_by.id.toString(),
            hours: t.estimated_hours,
            hist: [],
            com: [],
            done: t.completed_on,
            rating: t.rating
        }));

        // 5. Fetch Notifications
        const notesRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/notifications?page_size=100', { headers });
        if (!notesRes.ok) throw new Error("Failed to fetch notifications");

        const notesData = await notesRes.json();

        S.notes = notesData.items.map(n => ({
            id: n.id.toString(),
            text: n.message || n.title,
            read: n.is_read,
            ts: new Date(n.created_at).toLocaleString(),
            to: S.me
        }));

        // 6. Fetch Leaves
        const leavesRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/leave/my-leaves', { headers });
        if (!leavesRes.ok) throw new Error("Failed to fetch leave requests");

        const leavesData = await leavesRes.json();

        S.leaves = leavesData.map(l => ({
            id: l.id.toString(),
            emp: l.employee_id.toString(),
            type: l.leave_type,
            from: l.start_date,
            to: l.end_date,
            days: l.days,
            reason: l.reason,
            status: l.status,
            decidedBy: l.decided_by_id ? l.decided_by_id.toString() : null,
            decidedAt: l.decided_at,
            comment: l.comment,
            createdAt: l.created_at
        }));

        // Save and Render
        save();
        render();

        toast('Data loaded from database');

    } catch (err) {
        console.error(err);
        alert("Could not load data: " + err.message);
        logout();
    }
}

async function submitReport(){
  const content = document.getElementById('rep_content').value.trim();
  if(!content || content.length < 5) return toast('Please write a bit more', 'bad');
  
  const token = localStorage.getItem('access_token');
  try {
    const res = await fetch('https://employee360-backend-v1.onrender.com/api/v1/reports/submit', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ content: content })
    });

    if(!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Failed to submit");
    }

    toast('Report submitted!');
    document.getElementById('rep_content').value = '';
    loadReports();

  } catch(err) {
    alert("Error: " + err.message);
  }
}

async function loadReports(){
  const token = localStorage.getItem('access_token');
  try {
      const res = await fetch('https://employee360-backend-v1.onrender.com/api/v1/reports/my-reports', {
          headers: {
            'Authorization': `Bearer ${token}`

      const data = await res.json();
      const list = document.getElementById('reports_list');

  }
}

async function markAttendance(){
  const date = document.getElementById('att_date').value;
  const status = document.getElementById('att_status').value;
  const inTime = document.getElementById('att_in').value;
  const outTime = document.getElementById('att_out').value;
  
  const empSelect = document.getElementById('att_emp');
  let empId = null;

  if (empSelect && empSelect.value !== "") {
      empId = parseInt(empSelect.value);
  }
  
  const token = localStorage.getItem('access_token');

  try {
    const res = await fetch('https://employee360-backend-v1.onrender.com/api/v1/attendance/mark', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ 
        date: date, 
        status: status, 
        check_in: inTime || null, 
        check_out: outTime || null,
        employee_id: empId
      })

        throw new Error(err.detail || "Failed to mark attendance");

    toast('Attendance marked!');
    loadAttendance();

  } catch(err) {

async function loadAttendance(){
  const token = localStorage.getItem('access_token');
  const role = me().role;
  const isManager = role === 'admin' || role === 'teamlead';
  const isHR = role === 'hr' || role === 'admin';
  
  try {

    // 1. Load Team Attendance
    if (isManager || isHR) {
        const res = await fetch('https://employee360-backend-v1.onrender.com/api/v1/attendance/team-attendance', {
            headers: {
              'Authorization': `Bearer ${token}`
            }
        });

        if (!res.ok) {
            throw new Error("Failed to load team attendance");
        }

        const data = await res.json();
        const list = document.getElementById('att_list');
        
        if(!data || data.length === 0) {
            list.innerHTML = '<p style="color:var(--mute)">No team attendance records yet.</p>';
        } else {
            list.innerHTML = data.map(a => `
              <div style="display:flex; justify-content:space-between; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card2)">
                <div>
                  <b>${U(a.employee_id.toString())?.name || 'Unknown Employee'}</b>
                  <span style="font-size:11px; color:var(--mute)">(${new Date(a.date).toLocaleDateString()})</span><br>
                  <span style="font-size:11px; color:var(--mute)">In: ${a.check_in || '-'} | Out: ${a.check_out || '-'}</span>
                </div>
                <span class="tag ${a.status === 'Present' ? 'ok' : a.status === 'Absent' ? 'bad' : a.status === 'Holiday' ? 'blue' : 'warn'}">${a.status}</span>
              </div>
            `).join('');
        }
    }

    // 2. Load Attendance Summary
    const sumRes = await fetch('https://employee360-backend-v1.onrender.com/api/v1/attendance/summary', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
    });

    if (!sumRes.ok) {
        throw new Error("Failed to load attendance summary");
    }

    const sum = await sumRes.json();

        async function dropD(e, d) {
            e.preventDefault();


            if (!canManage()) return;

            const taskId = e.dataTransfer.getData('text/plain');
            const t = T(taskId);

            if (!t || t.start === d) return;

            // Calculate the new dates
            const len = diff(t.start, t.due);
            const newDue = addD(d, len);

            const token = localStorage.getItem('access_token');

            try {
                const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${taskId}/reschedule`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        start_date: d,
                        due_date: newDue
                    })
                });

                if (!res.ok) {
                    throw new Error("Failed to reschedule");
                }

                selD = d;
                toast('Rescheduled to ' + fmtD(d));

                await fetchRealData();

            } catch (err) {
                alert("Error rescheduling: " + err.message);
            }

        }

        }

        async function quickStatus(id, val) {
            const t = T(id);
            if (t.status === val) return;

            const token = localStorage.getItem('access_token');

            try {
                const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({status: val})
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Failed to update status");
                }

                toast('Status updated to ' + val);
                await fetchRealData(); // Reload from DB

            } catch (err) {
                alert("Error updating status: " + err.message);
                await fetchRealData(); // Revert if failed
            }
        }




        function approveFlow(id) {
            const t = T(id);
            if (!t) return;

            openModal({
                title: 'Approve task',
                sub: esc(t.title),
                body: `
            <p style="font-size:13px;color:var(--ink2);margin:0 0 12px;line-height:1.55">
                Rate the quality of this work. The score feeds into
                <b>${esc(U(t.emp).name.split(' ')[0])}</b>'s performance.
            </p>

            <label>Manager evaluation</label>
            <input id="rating_slider" type="range" min="0" max="100" value="85"
                oninput="document.getElementById('rtv').textContent=this.value">

            <div class="rangeout" id="rtv">85</div>

            <div class="row" style="justify-content:space-between;font-size:11px;color:var(--mute);font-weight:700;margin-top:2px">
                <span>Needs work</span>
                <span>Outstanding</span>
            </div>
        `,
                actions: [
                    {label: 'Cancel', kind: 'ghost'},
                    {
                        label: 'Approve & complete',
                        kind: 'ok',
                        onClick: async () => {

                            // Safety check to find the slider
                            const slider = document.getElementById('rating_slider');

                            if (!slider) {
                                alert("Error: Rating slider not found on the screen!");
                                return false;
                            }

                            const rating = slider.value;
                            const token = localStorage.getItem('access_token');

                            try {
                                const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${id}/approve`, {
                                    method: 'POST',
                                    headers: {
                                        'Authorization': `Bearer ${token}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        rating: parseInt(rating)
                                    })
                                });

                                if (!res.ok) {
                                    const errorData = await res.json();
                                    throw new Error(errorData.detail || "Failed to approve");
                                }

                                toast('Task Approved!');
                                await fetchRealData();

                            } catch (err) {
                                alert("Error approving task: " + err.message);
                                return false;
                            }
                        }
                    }
                ]
            });
        }








        function rejectFlow(id) {
            const t = T(id);
            if (!t) return;

            openModal({
                title: 'Request changes',
                sub: esc(t.title),
                body: `
            <label>Reason for rejection</label>
            <textarea id="rr" rows="3" placeholder="Explain clearly what needs to change..."></textarea>
        `,
                actions: [
                    {label: 'Cancel', kind: 'ghost'},
                    {
                        label: 'Send back',
                        kind: 'bad',
                        onClick: async () => {
                            const reason = document.getElementById('rr').value.trim();

                            if (!reason) {
                                toast('Add a reason first', 'bad');
                                return false;
                            }

                            const token = localStorage.getItem('access_token');

                            try {
                                const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${id}/request-changes`, {
                                    method: 'POST',
                                    headers: {
                                        'Authorization': `Bearer ${token}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({reason: reason})
                                });

                                if (!res.ok) {
                                    throw new Error("Failed to request changes");
                                }

                                toast('Sent back to employee', 'warn');
                                await fetchRealData();

                            } catch (err) {
                                alert("Error: " + err.message);
                                return false;
                            }
                        }
                    }
                ]
            });
        }




        function deadlineFlow(id) {
            const t = T(id);
            if (!t) return;

            openModal({
                title: 'Change deadline',
                sub: esc(t.title),
                body: `
            <label>New due date</label>
            <input id="dd" type="date" value="${t.due}" min="${t.start}">
        `,
                actions: [
                    {label: 'Cancel', kind: 'ghost'},
                    {
                        label: 'Save deadline',
                        kind: 'primary',
                        onClick: async () => {
                            const d = document.getElementById('dd').value;

                            if (!d) {
                                toast('Pick a date', 'bad');
                                return false;
                            }

                            if (d < t.start) {
                                toast('Due date must be on or after the start date', 'bad');
                                return false;
                            }

                            const token = localStorage.getItem('access_token');

                            try {
                                const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${id}/deadline`, {
                                    method: 'PUT',
                                    headers: {
                                        'Authorization': `Bearer ${token}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({due_date: d})
                                });

                                if (!res.ok) {
                                    throw new Error("Failed to update deadline");
                                }

                                toast('Deadline updated');
                                await fetchRealData();

                            } catch (err) {
                                alert("Error updating deadline: " + err.message);
                                return false;
                            }
                        }
                    }
                ]
            });
        }



        async function delT(id) {
            const t = T(id);

            const ok = await confirmAsk(
                'Delete task',
                `"${esc(t.title)}" will be permanently removed. This cannot be undone.`,
                'Delete',
                'bad'
            );

            if (ok) {
                const token = localStorage.getItem('access_token');

                try {
                    const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (!res.ok) {
                        throw new Error("Failed to delete task");
                    }

                    toast('Task deleted', 'warn');
                    await fetchRealData();

                } catch (err) {
                    alert("Error deleting task: " + err.message);
                }
            }
        }



        async function cmt(id) {
            const v = document.getElementById('cm').value.trim();
            if (!v) return;

            const token = localStorage.getItem('access_token');

            try {
                const res = await fetch(`https://employee360-backend-v1.onrender.com/api/v1/tasks/${id}/comments`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({body: v})
                });

                if (!res.ok) throw new Error("Failed to post comment");

                toast('Comment posted');
                await fetchRealData();
                showT(id);

            } catch (err) {
                alert("Error posting comment: " + err.message);
            }
        }


        /* ============ CREATE TASK ============ */
        function taskForm(emp, d) {
            const startD = d || today;
            openModal({
                title: 'Assign task',
                sub: 'Create a task and route it to your team.',
                body: `
<label>Title</label>
<input id="f1" placeholder="e.g. Finalise onboarding flow">
<label>Description <span style="font-weight:500;text-transform:none">(optional)</span></label>
<textarea id="f2" rows="2" placeholder="Any context the assignee needs..."></textarea>
<label>Assign to</label>
<select id="f3" multiple size="4">
${S.users.filter(u => u.active && u.role !== 'admin').map(u => `<option value="${u.id}" ${u.id === emp ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
</select>
<p style="font-size:11px;color:var(--mute);margin:4px 0 0">Hold Ctrl / ⌘ to select several people.</p>
<label>Project</label>
<select id="f4"><option value="">Independent task</option>${S.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
<div class="row grow" style="gap:10px">
<div style="flex:1"><label>Start</label><input id="f5" type="date" value="${startD}"></div>
<div style="flex:1"><label>Due</label><input id="f6" type="date" value="${startD}"></div>
<div style="flex:0 0 90px"><label>Hours</label><input id="f7" type="number" min="0" value="4"></div>
</div>
<label>Priority</label>
<select id="f8">${PR.map(p => `<option ${p === 'Medium' ? 'selected' : ''}>${p}</option>`).join('')}</select>
`,
                actions: [
                    {label: 'Cancel', kind: 'ghost'},
                    {label: 'Assign task', kind: 'primary', onClick: addT}
                ]
            });
        }

        async function addT() {
            const ti = $('#f1').value.trim();
            const es = [...$('#f3').selectedOptions].map(o => parseInt(o.value)); // IDs must be numbers
            const s = $('#f5').value, d = $('#f6').value;

            if (!ti) {toast('Enter a task title', 'bad'); return false}
            if (!es.length) {toast('Select at least one employee', 'bad'); return false}
            if (!s || !d || d < s) {toast('Due date must be on or after the start date', 'bad'); return false}

            const desc = $('#f2').value;
            const proj = $('#f4').value ? parseInt($('#f4').value) : null;
            const prio = $('#f8').value;
            const h = parseInt($('#f7').value) || 0;

            const token = localStorage.getItem('access_token');

            try {
                // Send the data to FastAPI!
                const res = await fetch('https://employee360-backend-v1.onrender.com/api/v1/tasks', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: ti,
                        description: desc,
                        assignee_ids: es,
                        project_id: proj,
                        start_date: s,
                        due_date: d,
                        estimated_hours: h,
                        priority: prio
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Failed to create task");
                }

                // Success! Close modal, reload data from DB, and refresh UI
                closeM();
                toast('Task created successfully!');
                await fetchRealData(); // This reloads the page with the new task

            } catch (err) {
                alert("Error creating task: " + err.message);
            }
        }

        /* ============ CREATE PROJECT ============ */
        function projForm() {
            openModal({
                title: 'New project',
                body: `
<label>Name</label>
<input id="f1" placeholder="e.g. Mobile app v2">
<label>Description</label>
<textarea id="f2" rows="2" placeholder="What is this project about?"></textarea>
<label>Project manager</label>
<select id="f3">
${S.users.filter(u => u.active && u.role !== 'employee').map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}
</select>
<label>Team members</label>
<select id="f4" multiple size="4">
${S.users.filter(u => u.active && u.role === 'employee').map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}
</select>
<div class="row grow">
<div style="flex:1"><label>Start</label><input id="f5" type="date" value="${today}"></div>
<div style="flex:1"><label>End</label><input id="f6" type="date" value="${addD(today, 30)}"></div>
</div>
<label>Priority</label>
<select id="f7">${PR.map(p => `<option ${p === 'Medium' ? 'selected' : ''}>${p}</option>`).join('')}</select>
`,
                actions: [
                    {label: 'Cancel', kind: 'ghost'},
                    {label: 'Create project', kind: 'primary', onClick: addP}
                ]
            });
        }


        async function addP() {
            const n = $('#f1').value.trim();
            const s = $('#f5').value;
            const e = $('#f6').value;


            if (!n) {
                toast('Enter a project name', 'bad');
                return false;
            }

            if (e < s) {
                toast('End date must be after the start date', 'bad');
                return false;
            }

            const desc = $('#f2').value;
            const mgr = parseInt($('#f3').value);
            const members = [...$('#f4').selectedOptions].map(o => parseInt(o.value));
            const prio = $('#f7').value;

            const token = localStorage.getItem('access_token');

            try {
                const res = await fetch('https://employee360-backend-v1.onrender.com/api/v1/projects', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: n,
                        description: desc,
                        manager_id: mgr,
                        member_ids: members,
                        start_date: s,
                        end_date: e,
                        priority: prio
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Failed to create project");
                }

                toast('Project created successfully!');
                await fetchRealData();

            } catch (err) {
                alert("Error creating project: " + err.message);
            }


        }


        /* ============ BOOT ============ */
        load();
        render();
    </script>
</body>
